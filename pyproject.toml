[project]
name = "project-two-building-with-apis"
version = "0.1.0"
description = "CIDM 3312 Project #2: Building With APIs"
requires-python = ">=3.14"
dependencies = [
    "django~=6.1.3",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "truststore>=0.10.5",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
testpaths = ["tests"]
norecursedirs = ["archive", ".venv", "node_modules"]

[tool.ruff]
# Migrations are generated by Django; the archive is kept only as a record.
extend-exclude = ["archive", "*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Django's dotted validator paths can't be split across lines.
"config/settings.py" = ["E501"]
